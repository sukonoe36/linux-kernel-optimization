# high-throughput.conf
# sysctl profile tuned for THROUGHPUT-oriented workloads (bulk transfer, file
# servers, batch pipelines, backup/restore). Every line states why we set it and
# what it costs.
#
# Apply with:  sudo ./tuning/apply-profile.sh --profile tuning/high-throughput.conf
# Revert with: sudo ./tuning/apply-profile.sh --revert
#
# Format: one "key = value" per line. Lines starting with '#' are comments and
# are ignored by apply-profile.sh.

# --- Congestion control -----------------------------------------------------
# BBR sustains high throughput on lossy links and long-fat networks without
# collapsing on a single loss, and paces via fq. Tradeoff: may not coexist
# perfectly fairly with CUBIC flows on shared bottlenecks.
net.ipv4.tcp_congestion_control = bbr
net.core.default_qdisc = fq

# --- Socket buffers (large, for high bandwidth-delay product) ---------------
# Big autotuning ceilings let a single flow fill a fat pipe. Tradeoff: more
# memory pinned per connection and a deeper queue -> higher latency for other
# flows sharing the link.
net.core.rmem_max = 67108864
net.core.wmem_max = 67108864
net.core.rmem_default = 1048576
net.core.wmem_default = 1048576
net.ipv4.tcp_rmem = 4096 1048576 67108864
net.ipv4.tcp_wmem = 4096 1048576 67108864

# A deeper device backlog absorbs bursts instead of dropping them. Tradeoff:
# adds queuing delay under sustained overload.
net.core.netdev_max_backlog = 16384

# Larger SYN backlog tolerates connect spikes without drops. Tradeoff: slightly
# more kernel memory reserved for half-open connections.
net.ipv4.tcp_max_syn_backlog = 8192

# --- Connection handling ----------------------------------------------------
# Recycle and expire TIME_WAIT sockets quickly to keep the port space free on
# busy servers. Tradeoff: relaxed TIME_WAIT semantics; acceptable for most
# stateless bulk workloads.
net.ipv4.tcp_tw_reuse = 1
net.ipv4.tcp_fin_timeout = 15

# Wider ephemeral port range for many concurrent outbound streams.
net.ipv4.ip_local_port_range = 10240 65535

# Grow the SYN/receive queues fast and disable slow start after idle so long
# idle-then-active transfers ramp immediately. Tradeoff: more aggressive bursts.
net.ipv4.tcp_slow_start_after_idle = 0
net.ipv4.tcp_auto_tuning = 1

# --- Page cache / dirty ratios (throughput-oriented) ------------------------
# Let the kernel buffer more dirty data before forcing writeback so it can
# coalesce writes into large sequential I/O. Tradeoff: a stall or crash can
# lose more dirty pages, and write latency spikes when writeback does trigger.
vm.dirty_ratio = 30
vm.dirty_background_ratio = 15

# Allow dirty data to accumulate longer before periodic writeback, producing
# larger and more efficient write bursts. Tradeoff: same data-loss window as
# above; avoid on hosts that cannot afford to lose minutes of writes.
vm.dirty_expire_centisecs = 3000
vm.dirty_writeback_centisecs = 3000

# Increase the number of in-flight writeback pages and file handles to keep
# storage queues full. Tradeoff: more memory used by writeback.
vm.dirty_background_bytes = 0
vm.min_free_kbytes = 262144

# --- Scheduler --------------------------------------------------------------
# Disable scheduler autogrouping so interactive tasks do not preempt bulk jobs
# as aggressively. Tradeoff: less interactive responsiveness under load.
kernel.sched_autogroup_enabled = 0
