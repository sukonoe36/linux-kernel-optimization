# network-latency.conf
# sysctl profile tuned for LATENCY-SENSITIVE workloads (RPC, databases, trading,
# interactive services). Every line states why we set it and what it costs.
#
# Apply with:  sudo ./tuning/apply-profile.sh --profile tuning/network-latency.conf
# Revert with: sudo ./tuning/apply-profile.sh --revert
#
# Format: one "key = value" per line. Lines starting with '#' are comments and
# are ignored by apply-profile.sh.

# --- Congestion control -----------------------------------------------------
# BBR models bandwidth and RTT instead of reacting to loss, which keeps queues
# short and cuts tail latency on lossy or long-fat paths. Tradeoff: BBR can be
# unfair to loss-based CUBIC flows sharing the same bottleneck.
net.ipv4.tcp_congestion_control = bbr

# FQ is the packet scheduler BBR is designed to pair with; it paces outgoing
# packets and limits per-flow queueing. Tradeoff: pacing adds a small CPU cost.
net.core.default_qdisc = fq

# --- Buffers and queues -----------------------------------------------------
# Small receive/send socket buffers keep queuing delay low (little's law: less
# buffered data = lower standing delay). Tradeoff: lower single-flow throughput
# on high-BDP links; revisit for bulk transfer hosts.
net.core.rmem_default = 262144
net.core.wmem_default = 262144

# Min/default/max autotuning bounds for TCP buffers. The max is kept moderate so
# a single flow cannot inflate bufferbloat. Tradeoff: caps throughput on very
# high bandwidth-delay-product paths.
net.ipv4.tcp_rmem = 4096 262144 4194304
net.ipv4.tcp_wmem = 4096 262144 4194304

# Cap the device backlog queue so bursts are dropped early (and retransmitted)
# rather than being buffered into latency. Tradeoff: some packet drops under
# microbursts; acceptable because drops here are cheap.
net.core.netdev_max_backlog = 1000

# --- Connection handling ----------------------------------------------------
# Recycle TIME_WAIT sockets for client-side connections when safe. Tradeoff:
# slightly weaker TIME_WAIT protection, which is fine for short-lived RPCs.
net.ipv4.tcp_tw_reuse = 1

# Keep-alive probes so dead peers are detected instead of holding sockets.
net.ipv4.tcp_keepalive_time = 300
net.ipv4.tcp_keepalive_intvl = 30
net.ipv4.tcp_keepalive_probes = 5

# Do not let a connection stall on a full accept backlog: fail fast instead.
net.ipv4.tcp_abort_on_overflow = 1

# --- Local port range -------------------------------------------------------
# Wider ephemeral port range reduces connect() port-exhaustion tail latency on
# busy client hosts. Tradeoff: none of note; just more ports in use.
net.ipv4.ip_local_port_range = 10240 65535

# --- Page cache / dirty ratios (latency-oriented) ---------------------------
# Keep dirty data bounded so writeback does not create long I/O stalls.
# Lower dirty_ratio/dirty_background_ratio means the kernel starts flushing
# earlier and more often. Tradeoff: more frequent smaller writes -> lower
# sequential write throughput on cache-heavy workloads.
vm.dirty_ratio = 10
vm.dirty_background_ratio = 5

# Bound how long dirty data may sit before periodic writeback kicks in. Shorter
# intervals smooth out I/O bursts. Tradeoff: more wakeups / background I/O.
vm.dirty_expire_centisecs = 1500
vm.dirty_writeback_centisecs = 500

# Keep some free memory headroom so reclaim does not spike latency. Tradeoff:
# less memory available to the page cache, which can hurt read caching.
vm.min_free_kbytes = 131072

# --- NUMA / scheduler -------------------------------------------------------
# Enable automatic NUMA balancing: cheaper remote-memory access for long-running
# services. Tradeoff: some sampling overhead.
kernel.numa_balancing = 1

# Mildly favor throughput in the scheduler while still waking up promptly.
kernel.sched_autogroup_enabled = 1
